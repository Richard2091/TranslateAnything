[package]
name = "translate-anything"
version = "0.2.3"
description = "随译——屏幕、软件界面随处可译"
authors = ["Richard"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "translate_anything_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
whatlang = "0.16"
tauri-plugin-global-shortcut = "2.4.1"
xcap = "0.9.10"
async-trait = "0.1.92"
dirs = "7.0.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Win32_Globalization", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Security", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Wdk_System_Threading", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Foundation_Metadata", "Security_Authorization_AppCapabilityAccess", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_System_Performance", "Win32_UI_HiDpi"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
image = { version = "0.25", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
sha2 = "0.10.9"
aws-lc-rs = "1.19.0"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# 开发版也做基础优化：实时截屏/OCR/位移估计在未优化构建下太慢
[profile.dev]
opt-level = 1

# 本项目自身（逐帧截屏比对、位移估计都在这里）在开发构建里也全速优化，依赖仍用上面的 opt-level 1
[profile.dev.package.translate-anything]
opt-level = 3
