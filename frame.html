<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.name"></title>
    <link rel="stylesheet" href="/src/frame/frame.css" />
  </head>
  <body>
    <!-- 圆角裁剪只影响视觉，边角缩放热区保持原样。 -->
    <div id="frame-visual">
      <div id="lens" aria-hidden="true"></div>
      <div id="blocks"></div>
      <!-- 原地没动的块（固定的标题栏、侧栏、字幕）：不随滚动平移 -->
      <div id="pinned"></div>
      <div id="border" aria-hidden="true"></div>
    </div>
    <!-- 边缘缩放热区 -->
    <div class="edge" data-dir="North"></div>
    <div class="edge" data-dir="South"></div>
    <div class="edge" data-dir="West"></div>
    <div class="edge" data-dir="East"></div>
    <div class="edge" data-dir="NorthWest"></div>
    <div class="edge" data-dir="NorthEast"></div>
    <div class="edge" data-dir="SouthWest"></div>
    <div class="edge" data-dir="SouthEast"></div>
    <!-- 工具条（右上角，鼠标进入翻译框时显示） -->
    <div id="toolbar" role="group" data-i18n-aria="frame.toolbar">
      <span id="status" title=""></span>
      <button type="button" id="btn-move" data-i18n-title="frame.move" data-i18n-aria="frame.move">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g fill="currentColor" stroke="none">
            <circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/>
            <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
            <circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>
          </g>
        </svg>
      </button>
      <button type="button" id="btn-mode" data-i18n-aria="frame.click_through" aria-disabled="true">
        <svg class="icon-unknown" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="currentColor" stroke="none">
            <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
          </g>
        </svg>
        <svg class="icon-pointer" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 3 14 9-6.5 1.1-3.1 6.4z"/>
        </svg>
        <svg class="icon-hand" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 13V6a1.5 1.5 0 0 1 3 0v5-6a1.5 1.5 0 0 1 3 0v6-4a1.5 1.5 0 0 1 3 0v5-2a1.5 1.5 0 0 1 3 0v4.5a6.5 6.5 0 0 1-6.5 6.5h-1a6 6 0 0 1-5-2.7l-3.3-5a1.6 1.6 0 0 1 2.5-2L8 13z"/>
        </svg>
      </button>
      <button type="button" id="btn-original">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
          <circle cx="12" cy="12" r="2.8"/>
        </svg>
      </button>
      <button type="button" id="btn-pause">
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5v14M15 5v14"/>
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 4.5v15l12-7.5z"/>
        </svg>
      </button>
      <button type="button" id="btn-close" data-i18n-title="frame.close" data-i18n-aria="frame.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="notices">
      <div id="loading-status" role="status" hidden></div>
      <div id="mode-status" role="status"></div>
      <div id="error" hidden></div>
    </div>
    <script type="module" src="/src/frame/main.ts"></script>
  </body>
</html>
