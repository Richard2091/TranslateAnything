<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="settings.title">Settings</title>
    <link rel="stylesheet" href="/src/settings/settings.css" />
  </head>
  <body>
    <!-- 自绘标题栏：整条透明，空白处拖动窗口、双击最大化 / 还原；右上角是窗口按钮 -->
    <div id="titlebar" data-tauri-drag-region>
      <div class="caption">
        <button id="win-min" type="button" data-i18n-title="window.minimize" data-i18n-aria="window.minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg></button>
        <button id="win-max" type="button" data-i18n-title="window.maximize" data-i18n-aria="window.maximize">
          <svg class="i-max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1" /></svg>
          <svg class="i-restore" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7" rx="1" /><path d="M2.5 2.5v-1a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1" /></svg>
        </button>
        <button id="win-close" type="button" data-i18n-title="window.close" data-i18n-aria="window.close"><svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9" /></svg></button>
      </div>
    </div>
    <nav id="nav">
      <div class="brand">
        <svg class="brand-mark" viewBox="36 36 184 184" aria-hidden="true">
          <defs>
            <linearGradient id="brand-acc" gradientUnits="userSpaceOnUse" x1="40" y1="40" x2="216" y2="216">
              <stop offset="0" stop-color="#3d7bff" /><stop offset="1" stop-color="#27c6ec" />
            </linearGradient>
            <clipPath id="brand-top"><rect x="0" y="0" width="256" height="133.88" /></clipPath>
            <clipPath id="brand-bottom"><rect x="0" y="143.88" width="256" height="256" /></clipPath>
          </defs>
          <g clip-path="url(#brand-top)"><path transform="translate(60 60) scale(1.36)" d="M50 3V13M10 25H90M73 34C68 44 60 52 50 58C40 52 32 44 27 34M50 58C38 68 26 82 13 96M50 58C62 68 74 82 87 96M29 80H71" fill="none" stroke="url(#brand-acc)" stroke-width="11.03" stroke-linecap="round" stroke-linejoin="round" /></g>
          <g clip-path="url(#brand-bottom)"><path class="brand-mark-dim" transform="translate(60 60) scale(1.36)" d="M50 3V13M10 25H90M73 34C68 44 60 52 50 58C40 52 32 44 27 34M50 58C38 68 26 82 13 96M50 58C62 68 74 82 87 96M29 80H71" fill="none" stroke-width="11.03" stroke-linecap="round" stroke-linejoin="round" /></g>
          <path d="M46.4 138.88H209.6" stroke="url(#brand-acc)" stroke-width="5.7" stroke-linecap="round" />
        </svg>
        <div>
          <div class="brand-name" data-i18n="app.name"></div>
          <div class="brand-sub">Translate Anything</div>
        </div>
      </div>

      <div class="nav-indicator" aria-hidden="true"></div>
      <div class="nav-group">
        <button data-tab="dashboard" class="active">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2" /><rect x="13.5" y="3.5" width="7" height="7" rx="2" /><rect x="3.5" y="13.5" width="7" height="7" rx="2" /><rect x="13.5" y="13.5" width="7" height="7" rx="2" /></svg>
          <span data-i18n="nav.dashboard"></span>
        </button>

        <div class="nav-label" data-i18n="nav.modes"></div>
        <button data-tab="overlay">
          <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2" /><path d="M8 10h8M8 14h5" /></svg>
          <span data-i18n="nav.overlay"></span>
        </button>
        <button data-tab="immersive">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M3 9h18" /><path d="M8 13.5h5M8 16.5h8" /></svg>
          <span data-i18n="nav.immersive"></span>
        </button>

        <div class="nav-label" data-i18n="nav.engines"></div>
        <button data-tab="mt">
          <svg viewBox="0 0 24 24"><path d="M4 5h7M7.5 3v2M10 5c-.7 3.3-2.8 6-5.5 7.5M6.5 8.5c1 1.6 2.6 3 4.5 3.8" /><path d="m12 21 4.5-10 4.5 10M13.6 17.5h5.8" /></svg>
          <span data-i18n="nav.mt"></span>
        </button>
        <button data-tab="ai">
          <svg viewBox="0 0 24 24"><path d="M12 3.5 13.8 9a2 2 0 0 0 1.2 1.2l5.5 1.8-5.5 1.8a2 2 0 0 0-1.2 1.2L12 20.5 10.2 15a2 2 0 0 0-1.2-1.2L3.5 12 9 10.2A2 2 0 0 0 10.2 9z" /></svg>
          <span data-i18n="nav.ai"></span>
        </button>

        <div class="nav-label" data-i18n="nav.resources"></div>
        <button data-tab="library">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8" /><path d="M4.5 5.5v13c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8v-13" /><path d="M4.5 12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8" /></svg>
          <span data-i18n="nav.library"></span>
        </button>
        <button data-tab="glossary">
          <svg viewBox="0 0 24 24"><path d="M5 19V5.5A2.5 2.5 0 0 1 7.5 3H19v14H7.5A2.5 2.5 0 0 0 5 19.5 2.5 2.5 0 0 0 7.5 22H19v-5" /><path d="M9 7.5h6M9 11h4" /></svg>
          <span data-i18n="nav.glossary"></span>
        </button>
      </div>

      <div class="nav-group nav-bottom">
        <button data-tab="general">
          <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2.2" /><circle cx="9" cy="17" r="2.2" /></svg>
          <span data-i18n="nav.general"></span>
        </button>
      </div>
    </nav>
    <main>
      <section id="tab-dashboard" class="tab active"></section>
      <section id="tab-overlay" class="tab"></section>
      <section id="tab-immersive" class="tab"></section>
      <section id="tab-mt" class="tab"></section>
      <section id="tab-ai" class="tab"></section>
      <section id="tab-library" class="tab"></section>
      <section id="tab-glossary" class="tab"></section>
      <section id="tab-general" class="tab"></section>
    </main>
    <button id="to-top" type="button" data-i18n-title="settings.toTop" data-i18n-aria="settings.toTop"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" /></svg></button>
    <div id="toast" hidden></div>
    <div id="modal" hidden></div>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
