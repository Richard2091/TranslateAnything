# 发布 Windows 安装包（x64 / ARM64）
#
# 用法：先把 package.json、src-tauri/Cargo.toml、src-tauri/tauri.conf.json 三处版本号改成一致，
# 提交后打标签并推送，例如：
#   git tag v0.2.0 && git push origin v0.2.0
# 工作流会建一个“草稿” Release 并上传各架构安装包，确认无误后在 GitHub 网页上手动发布。
# 也可以在 Actions 页面手动运行（workflow_dispatch），用于试打包。
#
# 后续适配 Linux / macOS 的计划见 docs/02-技术方案.md「多平台打包与发布」一节。

name: 发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            # x64 同时出 MSI 和 NSIS（.exe）两种安装包
            bundles: msi,nsis
          - label: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            # 交叉编译到 ARM64 时 Tauri 只支持 NSIS
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 检查标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne "${{ github.ref_name }}") {
            Write-Error "标签 ${{ github.ref_name }} 与 tauri.conf.json 里的版本 $ver 不一致"
            exit 1
          }

      # HTTPS 依赖的 aws-lc-sys 编译 ARM64 时必须用 clang-cl（GitHub 的 Windows 镜像自带 LLVM）
      - name: 检查 clang-cl（ARM64）
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: clang-cl --version

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 手动运行时不建 Release，只把安装包作为构建产物上传
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: Translate Anything v__VERSION__
          # 发布说明一律上中文、下英文；发布前在网页上补充本版更新内容时也按此格式
          releaseBody: |
            随译 Translate Anything v__VERSION__

            ## 下载说明

            - 大多数电脑（Intel / AMD 处理器）：下载文件名带 `x64` 的安装包
            - 骁龙等 ARM 处理器的 Windows 电脑：下载文件名带 `arm64` 的安装包
            - `.exe` 为常规安装程序，`.msi` 适合企业批量部署
            - `_portable.zip` 为便携版：解压即用，配置和译文库存在解压目录的 `data` 文件夹里，不写用户目录（需要系统自带的 WebView2，Windows 10/11 一般都有）

            ---

            ## Downloads

            - Most PCs (Intel / AMD): get the installer with `x64` in its name
            - ARM-based Windows PCs (e.g. Snapdragon): get the installer with `arm64` in its name
            - `.exe` is the regular installer; `.msi` is for managed / bulk deployment
            - `_portable.zip` is the portable version: unzip and run. Settings and translation memory stay in the `data` folder next to the program, nothing is written to your user folder (uses the system WebView2, which Windows 10/11 normally has)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 便携版：程序本体 + portable 标记文件，数据存在程序旁的 data 文件夹（见 config::portable_dir）
      - name: 打包便携版
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $arch = if ("${{ matrix.target }}" -like "aarch64*") { "arm64" } else { "x64" }
          $stage = "portable-stage/TranslateAnything"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/translate-anything.exe" "$stage/TranslateAnything.exe"
          Set-Content "$stage/portable" -Encoding utf8 -Value @(
            "随译 Translate Anything 便携版标记：有这个文件时，配置和译文库都保存在同目录的 data 文件夹。删掉它则改用用户目录。",
            "Translate Anything portable marker: while this file exists, settings and translation memory are stored in the data folder next to the program. Delete it to use your user folder instead."
          )
          $zip = "TranslateAnything_${ver}_${arch}_portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          "PORTABLE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: 上传便携版到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.PORTABLE_ZIP }}" --clobber

      - name: 上传构建产物（手动运行时）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: translate-anything-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            ${{ env.PORTABLE_ZIP }}
          if-no-files-found: error

  # 更新清单 latest.json：各架构都传完后，下载本 Release 的全部安装包，记下大小和 SHA-256，并用私钥签名。
  # 程序经 releases/latest/download/latest.json 这个固定地址检查更新，GitHub 加速镜像也能转发；
  # 清单必须通过签名校验（latest.json.sig，Ed25519），安装包再按清单里的 SHA-256 校验（见 src-tauri/src/update.rs）。
  # 需要仓库 Secrets 里有 UPDATE_SIGNING_KEY（PEM 格式的 Ed25519 私钥），缺了就让发布失败，不发未签名的清单
  manifest:
    name: 生成并签名更新清单
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 生成、签名并上传 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::缺少 Secrets UPDATE_SIGNING_KEY，无法签名更新清单"
            exit 1
          fi
          work="$RUNNER_TEMP/manifest"
          mkdir -p "$work/assets"
          key="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          chmod 600 "$key"
          # 私钥对应的公钥必须是程序内置的公钥之一，否则签了也验不过
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          if ! grep -q "\"$pub\"" src-tauri/src/update.rs; then
            echo "::error::签名私钥与 update.rs 里的 UPDATE_PUBKEYS 不匹配（公钥 $pub）"
            exit 1
          fi

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$work/assets" \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.zip'
          manifest="$work/latest.json"
          jq -n --arg version "${TAG#v}" --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, published_at: $published_at, assets: []}' > "$manifest"
          for f in "$work"/assets/*; do
            jq --arg name "$(basename "$f")" --argjson size "$(stat -c %s "$f")" \
              --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" \
              '.assets += [{name: $name, size: $size, sha256: $sha256}]' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done
          cat "$manifest"

          # 对清单原始字节做 Ed25519 签名，以十六进制保存，并用公钥自检一遍
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$manifest" -out "$work/sig.bin"
          openssl pkey -in "$key" -pubout -out "$work/pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$work/pub.pem" -rawin -in "$manifest" -sigfile "$work/sig.bin"
          od -An -tx1 "$work/sig.bin" | tr -d ' \n' > "$manifest.sig"

          gh release upload "$TAG" "$manifest" "$manifest.sig" --repo "$GITHUB_REPOSITORY" --clobber
